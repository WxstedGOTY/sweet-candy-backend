<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Courier Dashboard | Sweet Candy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --cream:#FBF3E7; --cherry:#C33149; --cherry-dark:#9E2436; --sea:#2A6F77; --gold:#E7A33E; --cocoa:#3B2A20; }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Nunito',sans-serif; background:var(--cream); color:var(--cocoa);}
  header{background:var(--sea); color:#fff; padding:16px 5%; display:flex; justify-content:space-between; align-items:center;}
  header .brand{font-family:'Fredoka',sans-serif; font-size:1.15rem;}
  header button{background:none; border:1px solid #fff; color:#fff; padding:6px 14px; border-radius:999px; cursor:pointer; font-weight:700;}
  .wrap{max-width:600px; margin:0 auto; padding:20px 5% 60px;}
  .order-card{background:#fff; border-radius:16px; padding:18px; margin-bottom:16px; box-shadow:0 8px 20px rgba(59,42,32,0.08);}
  .order-card h3{font-family:'Fredoka',sans-serif; color:var(--cherry-dark); font-size:1.05rem; margin-bottom:8px;}
  .order-card p{font-size:0.9rem; margin-bottom:6px;}
  .tag{display:inline-block; padding:3px 10px; border-radius:999px; font-size:0.75rem; font-weight:800; background:#FFF6E0; color:#8a6a1f;}
  .row{display:flex; gap:10px; margin-top:12px; flex-wrap:wrap;}
  .btn{padding:10px 16px; border-radius:999px; border:none; font-weight:800; cursor:pointer; font-size:0.85rem;}
  .btn-nav{background:var(--gold); color:var(--cocoa); text-decoration:none;}
  .btn-advance{background:var(--sea); color:#fff;}
  .empty{text-align:center; color:#8a7460; padding:40px 0;}
</style>
</head>
<body>
<header>
  <div class="brand">Sweet Candy — Courier</div>
  <button id="logoutBtn">Log out</button>
</header>
<div class="wrap" id="ordersWrap">Loading…</div>

<script>
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str ?? '';
  return div.innerHTML;
}

async function api(path, opts = {}) {
  const res = await fetch(path, { credentials: 'include', headers: {'Content-Type':'application/json'}, ...opts });
  if (res.status === 401 || res.status === 403) { window.location.href = 'login.html'; throw new Error('unauthorized'); }
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}

const NEXT_STATUS = { ready_for_delivery: 'out_for_delivery', out_for_delivery: 'delivered' };
const NEXT_LABEL = { ready_for_delivery: 'Mark out for delivery', out_for_delivery: 'Mark delivered' };
const STATUS_LABEL = { ready_for_delivery: 'Ready for delivery', out_for_delivery: 'Out for delivery', delivered: 'Delivered' };

async function loadOrders() {
  const data = await api('/api/courier/orders');
  const wrap = document.getElementById('ordersWrap');
  const active = data.orders.filter(o => o.status !== 'delivered');

  if (!active.length) {
    wrap.innerHTML = '<div class="empty">No deliveries assigned right now.</div>';
    return;
  }

  wrap.innerHTML = active.map(o => `
    <div class="order-card">
      <h3>${escapeHtml(o.customer.name)}</h3>
      <span class="tag">${STATUS_LABEL[o.status] || o.status}</span>
      <p><strong>Address:</strong> ${escapeHtml(o.customer.address)}${o.customer.city ? ', ' + escapeHtml(o.customer.city) : ''} ${escapeHtml(o.customer.postalCode || '')}</p>
      ${o.customer.buildingDetails ? `<p><strong>Building:</strong> ${escapeHtml(o.customer.buildingDetails)}</p>` : ''}
      ${o.customer.deliveryInstructions ? `<p><strong>Instructions:</strong> ${escapeHtml(o.customer.deliveryInstructions)}</p>` : ''}
      <p><strong>Phone:</strong> ${escapeHtml(o.customer.phone)}</p>
      <p><strong>Order total:</strong> €${o.total.toFixed(2)} &nbsp; <strong>Tip:</strong> €${o.tip.toFixed(2)}</p>
      <div class="row">
        <a class="btn btn-nav" href="${o.navigationUrl}" target="_blank" rel="noopener">Open in Maps</a>
        ${NEXT_STATUS[o.status] ? `<button class="btn btn-advance" data-order="${o.id}" data-next="${NEXT_STATUS[o.status]}">${NEXT_LABEL[o.status]}</button>` : ''}
      </div>
    </div>
  `).join('');

  wrap.querySelectorAll('.btn-advance').forEach(btn => {
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      try {
        await api(`/api/courier/orders/${btn.dataset.order}/status`, { method: 'PATCH', body: JSON.stringify({ status: btn.dataset.next }) });
        loadOrders();
      } catch (e) {
        alert(e.message);
        btn.disabled = false;
      }
    });
  });
}

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await api('/api/courier/logout', { method: 'POST' });
  window.location.href = 'login.html';
});

loadOrders();
setInterval(loadOrders, 20000);
</script>
</body>
</html>
